.sdc-rise{animation:sdcRise .28s ease-out;}

<div id="sdcSplash" aria-hidden="true"><div class="sdcSplashIn"><div class="sdcSplashT">DOMINIO CORPORAL</div><div class="sdcSplashN" id="sdcSplashN">Abriendo&#8230;</div><div class="sdcSplashBar"><span></span></div></div></div>
<style>
#sdcSplash{position:fixed;inset:0;z-index:9999;background:#0a0e1a;display:flex;align-items:center;justify-content:center;transition:opacity .25s ease}
#sdcSplash .sdcSplashIn{width:100%;max-width:300px;padding:0 16px;text-align:center}
#sdcSplash .sdcSplashT{font-family:'Chakra Petch',system-ui,sans-serif;font-size:15px;font-weight:700;letter-spacing:4px;color:#4f9dff}
#sdcSplash .sdcSplashN{font-family:'Inter',system-ui,sans-serif;font-size:14px;color:#7a83a0;margin-top:10px;min-height:20px}
#sdcSplash .sdcSplashBar{margin-top:22px;height:2px;background:rgba(255,255,255,0.08);overflow:hidden}
#sdcSplash .sdcSplashBar span{display:block;height:2px;width:40%;background:#4f9dff;animation:sdcSplashSlide 1.1s ease-in-out infinite}
@keyframes sdcSplashSlide{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
@media (prefers-reduced-motion:reduce){#sdcSplash .sdcSplashBar span{animation:none;width:100%;opacity:.5}}

<div id="root"></div>
<script>
(function(){
  try{
    var raw=localStorage.getItem('dominio-corporal:player/state');
    if(raw){
      var s=JSON.parse(raw),n=s&&s.profile&&s.profile.name,lv=s&&s.progress&&s.progress.level;
      if(n)document.getElementById('sdcSplashN').textContent='Hola de nuevo, '+n+(lv?'  ·  Nv. '+lv:'');
    }
  }catch(e){}
  var root=document.getElementById('root');
  if(!root)return;
  var quitar=function(){
    var sp=document.getElementById('sdcSplash');
    if(!sp)return;
    sp.style.opacity='0';
    setTimeout(function(){if(sp.parentNode)sp.parentNode.removeChild(sp)},260);
  };
  if(root.childNodes.length){quitar();return}
  var obs=new MutationObserver(function(){if(root.childNodes.length){obs.disconnect();quitar()}});
  obs.observe(root,{childList:true});
  setTimeout(function(){try{obs.disconnect()}catch(e){}quitar()},25000);
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
// Sin esto el navegador puede borrar localStorage cuando le falta espacio,
// y con el se va todo el progreso: no hay servidor ni cuenta.
if (navigator.storage && navigator.storage.persist) {
  navigator.storage.persisted()
    .then((ya) => { if (!ya) return navigator.storage.persist(); })
    .catch(() => {});
}
</script>

 gimnasio, debajo de las series vas a ver un campo de kilos para cada una: podés subir el peso serie a serie, y la próxima vez la app te recuerda lo que usaste la última."},{g:"PARA EMPEZAR",title:"Tu semana",text:"Vos elegís cuántas sesiones querés hacer por semana. Cuenta como sesión la rutina, una travesía, ganar un combate, una sesión de Instinto Primal o terminar una expedición: cualquiera de ellas marca el día como entrenado. Tu racha solo se corta si te salteás tantos días que ya no te alcanza para llegar a la meta. Un día suelto sin entrenar no cuesta nada, y nunca perdés XP. Abajo de la meta están los cuadraditos de tus últimos días, cada uno con el color del tipo de día que fue; tocá cualquiera para ver qué hiciste."},{g:"PARA EMPEZAR",title:"Si hoy no podés",text:"Hay tres salidas y ninguna te castiga. Modo Recuperación: hacés la mitad de las repeticiones, cuenta como entrenar y te mantiene la racha; está para los días en que llegás fundido. Día de descanso: uno por semana, el día que vos quieras, no da XP pero te conserva la racha y no cuenta como falta. Escudo de Racha: se compra con Puntos de Dominio y se gasta solo cuando hace falta, absorbiendo un día fallado sin que se corte nada. Y antes de entrenar la app te pregunta cómo llegás: si llegás sin ganas, te propone empezar por el calentamiento y hacer la rutina en Recuperación, y al terminar te pregunta cómo te vas. Con el tiempo vas a ver cuántas veces terminaste mejor de lo que llegaste. Si tocaste la cara que no era, «Cambiar respuesta» la corrige: la de llegada hasta que marcás la primera serie, la de salida en el resumen de la rutina. Se apaga en Perfil, en Sistemas del juego."},{g:"CÓMO PROGRESÁS",title:"Niveles y XP",text:"XP son los puntos que vas juntando. Todo lo que hacés da XP: la rutina, las travesías, el combate, el Instinto Primal, las expediciones, el calentamiento y el estiramiento. Cuando se llena la barra de arriba, subís un nivel. Cada nivel cuesta un poco más que el anterior, así que al principio subís seguido y después se va espaciando. Nunca perdés XP. Subir de nivel además abre sistemas nuevos: Combate, Travesías, Explorar y el resto van apareciendo solos. Arriba de todo siempre dice cuál es el próximo y a qué nivel llega."},{g:"CÓMO PROGRESÁS",title:"Los rangos y el Umbral",text:"El rango es tu etapa, y hay siete. Cambia dos cosas: qué versión de cada ejercicio te toca (de la más asistida a la más difícil) y cuántas repeticiones hacés. Todo el mundo empieza en el primero: la prueba inicial ajusta cuántas repeticiones hacés, no el rango. Para pasar al siguiente rango hay que llegar a cierto nivel y superar el Umbral, una prueba que aparece sola y encadena varias rondas de los cuatro patrones; solo podés darla un día en el que hayas completado tu rutina al 100%. En el séptimo y último rango el objetivo diario deja de salir de una tabla: es superar tu propio récord por lo menos un 1%, y si pasás siete días sin una rutina completa bajás al anterior hasta que vuelvas."},{g:"CÓMO PROGRESÁS",title:"Tu calibre",text:"Es lo que dice abajo de tu nombre: Principiante, Intermedio, Avanzado y así. Sale de la prueba de aptitud y no es lo mismo que el rango. El rango es lo que ganás entrenando; el calibre es lo que medís hoy. Solo sirve para ajustar cuántas repeticiones te toca hacer. Podés repetir la prueba cuando quieras desde tu Perfil, y repetirla no te cambia el rango ni te borra nada."},{g:"LOS SISTEMAS",title:"Combate",text:"Elegís con qué patrón atacar y la app te dice cuántas repeticiones vas a hacer y cuántos segundos vas a tener. El reloj arranca recién cuando tocás Empezar, nunca antes. Marcás cada serie igual que en la rutina y después golpeás. Si se te termina el tiempo perdés un corazón y elegís cómo seguir: reintentar igual, bajar la carga (menos repeticiones, pero tus golpes pegan más flojo) o cambiar de patrón. Cada cinco terrenos aparece un jefe, que encadena dos patrones sin descanso."},{g:"LOS SISTEMAS",title:"Travesías",text:"Una sesión larga de cardio, distinta cada día. Tocás Empezar, tenés diez segundos para ubicarte y la app corre el tiempo con vos, con la pantalla despierta. En las que van por intervalos (boxeo, HIIT, sprints, burpees, planchas) te marca FUERTE y SUAVE con un pitido; en las continuas te avisa cada cinco minutos. Recién cuando se cumple el tiempo podés completarla. Si saliste sin el teléfono, hay un enlace abajo para registrarla igual."},{g:"LOS SISTEMAS",title:"Instinto Primal",text:"Movimientos de control y coordinación en el suelo, en tres rondas cronometradas. El reloj arranca cuando tocás Empezar, con diez segundos para ubicarte. Hasta cinco sesiones por día. Si practicás dos veces el movimiento más nuevo que tengas, se te abre el siguiente."},{g:"LOS SISTEMAS",title:"Explorar",text:"Cuenta los kilómetros que caminás o corrés. Podés salir con la app: te cuenta el tiempo y estima la distancia según el ritmo que elijas, y al volver la corregís si hace falta. También podés anotar tramos a mano, en kilómetros o en pasos. Cuando juntás los kilómetros que pide una expedición se te revelan lugares del mapa, y cada uno deja una reliquia que queda guardada en el Códice y te suma un 3% de XP de exploración."},{g:"LOS SISTEMAS",title:"Estiramiento",text:"Dos rutinas guiadas: una corta de menos de cuatro minutos para después de entrenar y una completa de siete y medio. La app te va diciendo qué hacer, cuánto aguantar y cuándo cambiar de lado. Antes de cada posición tenés unos segundos para acomodarte, con el nombre de la que viene ya en pantalla: un pitido grave para que te prepares y uno agudo para empezar. La primera vez que te toca una posición, el reloj espera a que toques Listo, y podés pausar cuando quieras. La pantalla no se apaga. Estirar dos veces por semana te da +10% de XP la semana siguiente. Y una vez por semana te pregunta hasta dónde llegás sentado con las piernas estiradas y lo compara con cuando empezaste."},{g:"LOS SISTEMAS",title:"Primeras veces",text:"La app anota el día que hacés algo que antes no podías: tu primera flexión, tu primera dominada, llegar más lejos estirando. Primero te pregunta una sola vez si alguna vez hiciste cada movimiento. Si respondés que nunca pudiste, el día que lo logres queda anotado, con fecha, y no se borra nunca. También podés escribir a mano cualquier cosa que la app no pueda ver."},{g:"LOS SISTEMAS",title:"El mapa de tu cuerpo",text:"Es la figura que está arriba de todo en Entreno. Cada zona se pinta más fuerte cuanto más la entrenaste, así que de un vistazo ves qué estás descuidando. Tocá cualquier zona para ver su nivel, tus repeticiones de por vida en ese patrón y cuántos días lleva sin estímulo."},{g:"LO DEMÁS",title:"Las tres modalidades",text:"Son las tres formas de entrenar que entiende la app: peso corporal (solo con tu cuerpo), gimnasio (con pesas y máquinas) y flow (movimiento en el suelo, movilidad y control). Podés tener varias activas y elegir cada día con cuál entrenás. Si una modalidad no cubre alguno de los cuatro patrones, para ese patrón se usa la versión de peso corporal."},{g:"LO DEMÁS",title:"Puntos de Dominio",text:"Son la moneda del juego. Ganás 3 el día que completás tu rutina al 100%, o 1 si llegás al menos a la mitad; cuenta solo la primera sesión de cada día. También los dan las misiones, cada reliquia nueva y los 147 logros, que se desbloquean solos apenas cumplís la condición: no hace falta que los vayas a buscar. Se gastan en la tienda, que se abre tocando el número violeta de arriba a la derecha: hay cosas que duran un día y dos mejoras que son para siempre."},{g:"LO DEMÁS",title:"El metrónomo",text:"Es el pitido que marca el ritmo de cada repetición: bajás, pausás abajo y subís. Está para que no aceleres, y es el mismo ritmo de la prueba de aptitud. Si el modificador del día pide otro ritmo, el metrónomo se ajusta solo. No cuenta repeticiones ni sabe cuándo terminaste: eso lo marcás vos tocando cada serie. En los ejercicios de sostén, como la plancha, no aplica: ahí lo que importa son los segundos, no el sube y baja."},{g:"LO DEMÁS",title:"Guardá tu progreso",text:"Esto es importante. Todo lo tuyo se guarda en este teléfono y en ningún otro lado. No hay cuenta ni servidor: nadie ve tus datos, pero tampoco hay una copia esperándote si perdés el teléfono o borrás los datos del navegador. Andá a Perfil, abrí Respaldo de tu progreso, copiá el texto y guardalo donde quieras (un mail a vos mismo alcanza). Con ese texto recuperás todo, o lo pasás a un teléfono nuevo."}],El=[{id:"handstand",name:"Pino (Handstand)",family:"Calistenia",level:"Intermedio",what:"Sostenerte invertido sobre las manos con el cuerpo alineado.",why:"Construye fuerza de hombros, control escapular y una conciencia corporal que se transfiere a todo lo dem\xE1s.",steps:[{name:"Plancha de hombros en pared",how:"De espaldas a la pared, manos en el suelo, pies apoyados en la pared a la altura de la cadera. Aguanta manteniendo el core apretado.",cue:"Costillas hacia dentro, sin arquear la lumbar."},{name:"Wall walk",how:"Desde plancha, camina los pies por la pared mientras acercas las manos, hasta quedar casi vertical de cara a la pared. Baja con control.",cue:"Mira entre las manos, no al suelo."},{name:"Pino de cara a la pared",how:"Sube y aguanta con el pecho hacia la pared, manos a un palmo del rodapi\xE9.",cue:"Aprieta gl\xFAteos y estira las puntas hacia el techo."},{name:"Pino libre con toques",how:"De cara a la pared, despega un pie, luego el otro, aguantando segundos sueltos.",cue:"Corrige con los dedos de las manos, no con la espalda."},{name:"Pino libre",how:"Entra con una patada controlada lejos de la pared y sost\xE9n.",cue:"Si te pasas, sal girando hacia un lado; nunca caigas de espalda."}],regression:"Si te duelen las mu\xF1ecas, trabaja primero en pu\xF1os o paraletas y haz movilidad de mu\xF1eca antes.",mistake:"Arquear la lumbar en banana. Es la causa n\xFAmero uno de perder el equilibrio."},{id:"pistol",name:"Pistol Squat",family:"Calisteni r 20 segundos seguidos.",cue:"Respira. No aguantes el aire."}],regression:"Trabaja compresi\xF3n sentado: piernas estiradas en el suelo, intenta despegar los talones.",mistake:"Encoger los hombros. Deprime las esc\xE1pulas antes de despegar."},{id:"muscleup",name:"Muscle-Up",family:"Calistenia",level:"Avanzado",what:"Pasar de colgado a apoyo sobre la barra en un solo movimiento.",why:"Une tracci\xF3n explosiva y empuje. Es el puente entre dominadas y fondos.",steps:[{name:"Dominadas al pecho",how:"Domina llevando el estern\xF3n a la barra, no solo la barbilla.",cue:"Codos hacia atr\xE1s y abajo."},{name:"Fondos en barra",how:"Sobre la barra en apoyo, baja y sube con control.",cue:"Mu\xF1ecas por encima de la barra desde el inicio."},{name:"Transici\xF3n con banda",how:"Con una banda asistiendo, practica el paso de tracci\xF3n a apoyo.",cue:"Cuando llegues arriba, mete las mu\xF1ecas r\xE1pido."},{name:"Muscle-up con impulso",how:"Permite un balanceo controlado para pasar la transici\xF3n.",cue:"Tira hacia ti, no hacia arriba."},{name:"Muscle-up estricto",how:"Sin balanceo, desde colgado muerto.",cue:"Agarre falso ayuda mucho en la transici\xF3n."}],regression:"Si no llegas al pecho en dominadas, acumula primero 10 dominadas estrictas limpias.",mistake:"Intentarlo sin base de dominadas. Te llevar\xE1s un golpe y ning\xFAn progreso."},{id:"frontlever",name:"Front Lever",family:"Calistenia",level:"Avanzado",what:"Colgado de la barra, cuerpo horizontal y r\xEDgido mirando arriba.",why:"M\xE1xima tensi\xF3n de dorsal y core en cadena posterior. Un est\xE1tico de referencia.",steps:[{name:"Dominada con esc\xE1pulas",how:"Colgado, baja los hombros sin doblar los codos. Sost\xE9n 5 segundos.",cue:"Ese es el punto de partida de toda la progresi\xF3n."},{name:"Tuck lever",how:"Sube las rodillas al pecho y deja el torso horizontal.",cue:"Espalda redonda, cadera a la altura de los hombros."},{name:"Advanced tuck",how:"Abre el \xE1ngulo de cadera manteniendo rodillas flexionadas a.",cue:"Sost\xE9n 20 segundos."},{name:"Puente sobre la cabeza",how:"Manos junto a las orejas, empuja hasta apoyar la coronilla.",cue:"Para aqu\xED si los hombros protestan."},{name:"Puente con codos estirados",how:"Empuja hasta estirar los brazos completamente.",cue:"Reparte el arco: hombros y cadera, no solo lumbar."},{name:"Puente caminando",how:"En el puente, camina manos y pies acerc\xE1ndolos.",cue:"Respira profundo dentro de la postura."}],regression:"Trabaja movilidad de hombros con un palo antes de intentar el puente alto.",mistake:"Forzar solo desde la lumbar. Si te pellizca, falta apertura de hombro."},{id:"crow",name:"Postura del Cuervo",family:"Animal Flow",level:"Principiante",what:"Equilibrio sobre las manos apoyando las rodillas en los triceps.",why:"Primera toma de contacto con el equilibrio sobre manos. Menos intimidante que el pino.",steps:[{name:"Cuclillas profundas",how:"Ponte en cuclillas con los pies juntos y las manos en el suelo delante.",cue:"Talones pueden despegarse al principio."},{name:"Cargar peso",how:"Incl\xEDnate adelante pasando peso a las manos, sin despegar los pies.",cue:"Codos ligeramente flexionados, dedos agarrando el suelo."},{name:"Un pie arriba",how:"Despega un pie apoyando la rodilla en el triceps.",cue:"Mira un punto medio metro delante de las manos."},{name:"Dos pies arriba",how:"Despega ambos pies y sost\xE9n unos segundos.",cue:"Redondea la espalda, no la mantengas plana."},{name:"Cuervo 30 segundos",how:"Acumula hasta sostener medio minuto estable.",cue:"Pon un coj\xEDn delante mientras aprendes."}],regression:"Si te caes de cara, baja m\xE1s la cadera y mira m\xE1s adelante.",mistake:"Mirar a los pies. La cabeza dirige el equilibrio."},{id:"shrimp",name:"Shrimp Squat",family:"Calistenia",level:"Intermedio",what:"Sentadilla a una pierna con la otra flexionada atr\xE1s, sujeta con la mano.",why:"Alternativa a la pistol con menos exigencia de tobillo y m\xE1s de cu\xE1driceps.",steps:[{name:"Zancada inversa profunda",  carga hasta mantenerla pareja.",repFactor:.8,alt:"Cuenta las reps por pierna. Sin prensa: zancada con mancuernas."}],B:[{name:"Zancadas con mancuernas",pos:"De pie, una mancuerna en cada mano, brazos al costado.",mov:"Da un paso al frente y baja hasta que la rodilla de atrás quede a un dedo del suelo, y vuelve.",err:"Si te vas de lado, separa un poco los pies: no caminas sobre una línea.",repFactor:.8,alt:"Cuenta las reps por pierna."},{name:"Sentadilla búlgara con mancuernas",pos:"De pie con el empeine de atrás sobre un banco y el pie de adelante a un paso largo.",mov:"Baja recto hasta que el muslo de adelante quede paralelo al suelo y sube.",err:"Si la rodilla de adelante pasa mucho el pie, aleja más el pie de atrás.",repFactor:.7,alt:"Pie trasero en un banco. Cuenta las reps por pierna."},{name:"Peso muerto convencional",pos:"De pie con los pies bajo la barra, agarre por fuera de las rodillas, pecho arriba y espalda recta.",mov:"Empuja el suelo con los pies y sube la barra pegada a la pierna hasta quedar de pie.",err:"Si la cadera sube antes que el pecho, la espalda hace todo el trabajo: baja la carga.",repFactor:.8,alt:"Barra pegada a las piernas, empuja el suelo con los pies."}],A:[{name:"Sentadilla frontal / peso muerto",pos:"Frontal: barra sobre los deltoides delanteros y codos altos. Peso muerto: barra en el suelo y agarre firme.",mov:"Baja con el torso vertical y sube, o levanta la barra empujando el suelo con los pies.",err:"Si los codos caen en la frontal, la barra se va adelante: usa menos peso.",repFactor:.55,alt:"Carga alta, técnica intacta."},{name:"Hip thrust pesado",pos:"Espalda alta apoyada en un banco, barra con almohadilla sobre la cadera, pies firmes.",mov:"Sube hasta alinear rodillas, cadera y hombros, aguanta un segundo apretando el glúteo y baja.",err:"Si no sientes el glúteo, acerca los pies al cuerpo.",repFactor:.6,alt:"Pausa de un segundo arriba, glúteo apretado."},{name:"Sentadilla búlgara pesada",pos:"Empeine de atrás sobre un banco, mancuernas pesadas en las manos o barra sobre la espalda.",mov:"Baja recto hasta que el muslo de adelante quede paralelo al suelo y sube.",err:"Si pierdes el equilibrio, baja la carga: con peso alto un traspié es una lesión.",repFactor:.5,alt:"Cuenta las reps por pierna. Sube la carga solo si no pierdes el equilibrio."}],S:[{name:"Sentadilla pesada / peso muerto pesado",pos:"Dentro del rack con los seguros a la altura del fondo, o la barra en el suelo con el agarre listo.",mov:"Series cortas de fuerza máxima, bajando y subiendo con la técnica intacta.",err:"Si la técnica cambia en la última repetición, esa serie ya terminó.",repFactor:.4,alt:"Series de fuerza máxima."},{name:"Sentadilla frontal pesada",pos:"Barra sobre los deltoides delanteros, codos bien altos, dedos apenas debajo de la barra.",mov:"Baja con el torso vertical hasta el fondo y sube empujando el suelo con los pies.",err:"Si no llegas al agarre, usa correas o agarre cruzado, pero no bajes los codos.",repFactor:.4,alt:"Codos altos. Si no llegas al agarre, usa correas o agarre cruzado."},{name:"Peso muerto rumano pesado",pos:"De pie con la barra a la altura del muslo, rodillas casi rectas, espalda recta.",mov:"Lleva la cadera atrás con la barra pegada a la pierna, solo hasta donde la espalda siga recta.",err:"Si buscas más rango doblando la espalda, cambiaste el ejercicio por otro peor.",repFactor:.45,alt:"Baja solo hasta donde la espalda siga recta."}],Z:[{name:"Sentadilla pesada con tempo 4s",pos:"Barra sobre los trapecios, dentro del rack y con los seguros puestos.",mov:"Baja en 4 segundos contados hasta el fondo y sube a velocidad normal.",err:"Si el último segundo se te va de golpe, baja la carga: el tempo es el ejercicio.",repFactor:.3,alt:"Descenso de 4 segundos bajo carga."},{name:"Peso muerto con pausa bajo la rodilla",pos:"De pie con los pies bajo la barra, espalda recta y pecho arriba.",mov:"Sube hasta media canilla, aguanta dos segundos ahí y sigue hasta quedar de pie.",err:"Si en la pausa la "},{name:"Crunch en polea de rodillas",pos:"De rodillas frente a la polea alta, la cuerda al lado de la cara y los codos doblados.",mov:"Curva la columna llevando los codos hacia los muslos y vuelve con control.",err:"Si te doblas por la cadera es una reverencia, no un crunch: mueve solo la columna.",repFactor:1,alt:"El movimiento es de columna, no de cadera. Sin polea: crunch en el suelo."},{name:"Elevación de rodillas en paralelas",pos:"Apoyado en los antebrazos en la torre de paralelas, espalda contra el respaldo.",mov:"Sube las rodillas hasta la altura de la cadera y bájalas con control.",err:"Si te balanceas, para en cada repetición antes de volver a subir.",repFactor:.9,alt:"Sin paralelas: elevación de rodillas colgado de la barra."}],C:[{name:"Rueda abdominal de rodillas",pos:"De rodillas con la rueda bajo los hombros y los brazos estirados.",mov:"Rueda hacia adelante todo lo que controles y vuelve tirando del abdomen.",err:"Si la lumbar se arquea, no vayas tan lejos: la cadera no se hunde.",repFactor:1,alt:"No dejes caer la cadera. Sin rueda: una barra con discos que giren, o dos trapos bajo las manos."},{name:"Elevaciones de piernas colgado",pos:"Colgado de la barra, brazos estirados, piernas juntas y rectas.",mov:"Sube las piernas rectas hasta la horizontal y bájalas con control.",err:"Si necesitas impulso, dobla las rodillas hasta poder hacerlo sin balanceo.",repFactor:.8,alt:"Sin barra: elevaciones tumbado con la lumbar pegada al suelo."},{name:"Plancha lateral con disco",pos:"De costado sobre un antebrazo, codo bajo el hombro, un disco sobre la cadera de arriba.",mov:"Sube la cadera hasta alinear hombro, cadera y tobillo y aguanta 3 segundos por repetición.",err:"Si la cadera se cae con el disco, sácalo y mantén la línea limpia.",repFactor:0.33,alt:"1 rep = 3 segundos por lado. Sin disco: una mochila cargada apoyada en la cadera."}],B:[{name:"Elevaciones colgado con lastre",pos:"Colgado de la barra con un lastre entre los pies o en los tobillos.",mov:"Sube las piernas hasta la horizontal y bájalas con control, sin balanceo.",err:"Si el lastre te hace balancear, baja el peso antes que perder el control.",repFactor:.7,alt:"Sin balanceo."},{name:"Rueda abdominal de rodillas con lastre",pos:"De rodillas con la rueda bajo los hombros y un disco o chaleco en la espalda.",mov:"Rueda hacia adelante lo que controles y vuelve tirando del abdomen.",err:"Si la cadera baja, quita el lastre: con peso encima la lumbar paga el error.",repFactor:.7,alt:"Disco en la espalda o chaleco. La cadera no baja. Sin rueda: barra con discos que giren y un disco en la espalda."},{name:"Crunch en polea pesado",pos:"De rodillas frente a la polea alta, la cuerda al lado de la cara.",mov:"Curva la columna con rango corto llevando los codos hacia los muslos y vuelve.",err:"Si tiras con los brazos, suelta carga: el abdomen tiene que sentirlo.",repFactor:.8,alt:"Carga alta y rango corto, sin tirón de brazos. Sin polea: crunch en el suelo con un disco detrás de la cabeza."}],A:[{name:"Pallof press pesado",pos:"De pie de costado a la polea con carga alta, manija contra el pecho, base firme.",mov:"Estira los brazos al frente y aguanta 3 segundos por repetición sin rotar.",err:"Si la cadera se abre hacia la polea, baja la carga: es anti-rotación, no un press.",repFactor:0.18,alt:"Anti-rotación: 1 rep = 3 s de tensión. Sin polea: banda gruesa atada a un poste, la misma tensión."},{name:"Toes to bar lastrado",pos:"Colgado de la barra con lastre en los tobillos, brazos estirados y cuerpo quieto.",mov:"Sube los pies hasta tocar la barra y baja con control.",err:"Si te balanceas, para entre repeticiones: el impulso no cuenta.",repFactor:.5,alt:"Sin lastre: toes to bar estricto, sin balanceo."},{name:"Plancha con lastre",pos:"Plancha sobre los antebrazos con un disco en la espalda alta, cuerpo en línea.",mov:"Aguanta apretando abdomen y glúteos, 3 segundos por repetición.",err:"Si la lumbar se hunde, el disco está mal puesto o es demasiado.",repFactor:0.18,al pos:"De pie con los pies en un escalón, inclinado hacia adelante y la rueda en el suelo.",mov:"Rueda hacia adelante aprovechando el recorrido extra y vuelve.",err:"Si no puedes volver sin apoyar, baja del escalón: esta es la versión más larga.",repFactor:.3,alt:"Los pies en un escalón para alargar el recorrido. Sin rueda: barra con discos y los pies en un escalón."}]}},P2={squat:{E:[{name:"Sentadilla profunda con apoyo (sostén)",pos:"De pie frente a algo firme donde sujetarte, pies al ancho de los hombros y punteras algo hacia afuera.",mov:"Baja hasta el fondo, con la cadera cerca de los talones, y aguanta ahí.",err:"Si los talones se despegan, apoya algo fino debajo o separa un poco más los pies.",repFactor:1,alt:"1 rep = 3 segundos en la posición baja."},{name:"Ginga de capoeira",pos:"De pie, pies al ancho de los hombros, rodillas blandas y una mano suelta delante de la cara.",mov:"Lleva un pie atrás en diagonal doblando las dos rodillas, vuelve al centro y repite con el otro.",err:"Si el cuerpo queda rígido, baja el centro de gravedad: la ginga se hace en semicuclillas.",repFactor:1,alt:"El paso base: un pie atrás en diagonal y vuelta al centro, alternando sin parar. 1 rep = 1 ciclo completo."},{name:"Sentadilla profunda con balanceo",pos:"En el fondo de una sentadilla profunda, talones en el suelo y codos por dentro de las rodillas.",mov:"Mece el peso de un pie al otro sin levantarte del fondo.",err:"Si te levantas para pasar de un lado al otro, la cadera deja de trabajar.",repFactor:1,alt:"Abajo del todo, mece el peso de un pie al otro sin levantarte."}],D:[{name:"Movilidad de cadera 90/90",pos:"Sentado en el suelo, una pierna doblada al frente y la otra al costado, las dos a 90 grados.",mov:"Gira las dos rodillas al otro lado hasta invertir la posición, sin usar las manos.",err:"Si necesitas las manos, abre más el ángulo entre las piernas antes de girar.",repFactor:1,alt:"Rotación completa sin usar las manos."},{name:"Negativa de capoeira",pos:"En cuclillas con los talones apoyados y una mano en el suelo al costado.",mov:"Estira una pierna al costado bajando el torso, y vuelve a cuclillas. Alterna lados.",err:"Si la cadera toca el suelo, el peso está en la pierna equivocada: cárgalo en la doblada.",repFactor:.9,alt:"Desde cuclillas, una pierna estirada al costado y el torso bajo, apoyando una mano. Cuenta las reps por lado."},{name:"Toprock: paso indio",pos:"De pie, pies al ancho de la cadera, rodillas blandas y el peso en la planta del pie.",mov:"Cruza un pie por delante del otro y vuelve a abrir, alternando al ritmo.",err:"Si pisas con el talón pierdes el rebote: el toprock vive en la planta.",repFactor:1,alt:"De pie, cruza y abre alternando al ritmo. 1 rep = 1 ciclo."}],C:[{name:"Sentadilla cosaca de movilidad",pos:"De pie con los pies bien separados y las punteras algo hacia afuera.",mov:"Baja sobre una pierna estirando la otra al costado, y pasa al otro lado con control.",err:"Si el talón de la pierna que baja se despega, apoya las manos delante y baja menos.",repFactor:1,alt:"Alterna lados con control."},{name:"Rolê",pos:"En la negativa: cuclillas con una pierna estirada al costado y una mano en el suelo.",mov:"Rueda bajo hacia el otro lado pasando el peso por las manos, sin apoyar la cadera.",err:"Si te sientas al pasar, el rolê se corta: la cadera va despegada todo el recorrido.",repFactor:.9,alt:"Rodada baja de lado a lado pasando por la negativa, sin apoyar la cadera. Cuenta las reps por lado."},{name:"2-step de footwork",pos:"En cuclillas bajas con las dos manos y un pie en el suelo, la otra pierna estirada.",mov:"Cruza la pierna estirada por delante y vuelve, alternando el apoyo.",err:"Si te sientas, sube la cadera: el peso va repartido entre las manos y el pie.",repFactor:1,alt:"Manos y un pie en el suelo, la otra pierna cruza y vuelve. 1 rep = 1 ciclo."}],B:[{name:"Crab reach (puente de cangrejo)",pos:"Sentado con las manos detrás y los pies apoyados, cadera despegada del suelo.",mov:"Suelta una mano y llévala por encima de la cabeza abriendo el pecho al techo, y vuelve.",err:"Si la cadera baja al soltar la mano, empuja más con los pies y con el hombro de apoyo.",repFactor:.8,alt:"Abre el pecho al techo en cada rep."},{name:"6-step de footwork",pos:"En cuclillas bajas con las dos manos en el suelo y el peso repartido entre manos y pies.",mov:"Da seis pasos en círculo alrededor de las manos, pasando una pierna por delante y otra por detrás.",err:"Si apoyas las rodillas, subiste demasiado la cadera: quédate bajo.",repFactor:.8,alt:"El círculo básico de breakdance sobre las manos. 1 rep = 1 vuelta completa."},{name:"Sentadilla cosaca con paso",pos:"De pie con los pies bien separados y las punteras algo hacia afuera.",mov:"Baja sobre una pierna y desplázate al otro lado sin subir en ningún momento.",err:"Si te levantas para cruzar, se vuelven dos cosacas sueltas.",repFactor:.7,alt:"Baja a un lado y desplázate al otro sin subir. Cuenta las reps por lado."}],A:[{name:"Underswitch",pos:"En posición de bestia: cuadrupedia con las rodillas flotando a un palmo del suelo.",mov:"Pasa una pierna por debajo del cuerpo hasta quedar de cangrejo, y vuelve por el mismo camino.",err:"Si la cadera toca el suelo al pasar, sube más el hombro del lado que se abre.",repFactor:.6,alt:"Pasa la pierna por debajo con fluidez."},{name:"CC de footwork",pos:"En cuclillas bajas con las dos manos en el suelo y una pierna estirada.",mov:"Barre el suelo con la pierna estirada dibujando un arco y cambia el apoyo. Alterna lados.",err:"Si la pierna se dobla al barrer, acorta el arco antes que perder la línea.",repFactor:.5,alt:"Variante del 6-step con la pierna estirada barriendo el suelo. Cuenta las reps por lado."},{name:"Sentadilla a una pierna con rotación",pos:"De pie sobre una pierna con la otra estirada al frente, brazos adelante.",mov:"Baja a una pierna y sal girando el cuerpo hacia el costado de la pierna libre.",err:"Si pierdes el equilibrio en el giro, baja menos y gira desde más arriba.",repFactor:.5,alt:"Baja a una pierna y sal girando hacia el costado. Cuenta las reps por lado."}],S:[{name:"Kickthrough continuo",pos:"En posición de bestia, rodillas flotando y hombros sobre las manos.",mov:"Saca una pierna cruzada por debajo del cuerpo, gira la cadera y vuelve, alternando sin parar.",err:"Si la cadera toca el suelo, sube el hombro contrario y acorta la patada.",repFactor:.5,alt:"Sin tocar el suelo con la cadera."},{name:"Macaco",pos:"En cuclillas con los pies apoyados y una mano en el suelo detrás de la cadera, dedos hacia ti.",mov:"Empuja con las piernas y pasa la cadera por encima de ese hombro, cayendo del otro lado.",err:"Si el peso te cae en la muñeca, gira más la mano hacia afuera y mira al suelo.",repFactor:.4,alt:"Desde cuclillas, una mano atrás y el cuerpo pasa por encima del hombro. Cuenta las reps por lado."},{name:"6-step con cambios de dirección",pos:"En cuclillas bajas con las manos en el suelo, ya en movimiento.",mov:"Haz el círculo completo y cambia el sentido sin detenerte entre una vuelta y la siguiente.",err:"Si necesitas parar para cambiar, vas más rápido de lo que controlas.",repFactor:.45,alt:"Cambia el sentido del círculo sin detenerte. 1 rep = 1 vuelta."}],Z:[{name:"Secuencia de flow enlazada",pos:"En el suelo, en la posición de arranque de la primera transición que elijas.",mov:"Encadena las transiciones que ya dominas sin pausa entre una y la siguiente.",err:"Si te detienes a pensar la que viene, acorta la secuencia hasta que salga sola.",repFactor:.4,alt:"Encadena sin pausas entre transiciones."},{name:"Ginga, aú y macaco enlazados",pos:"De pie en ginga, con espacio libre a los dos costados.",mov:"Desde la ginga sal a la rueda lateral, cae y entra directo al macaco.",err:"Si necesitas acomodarte entre un elemento y el otro, el enlace todavía no está.",repFactor:.35,alt:"Tres elementos sin parar entre uno y otro. 1 rep = 1 pasada completa."},{name:"Footwork continuo a ritmo",pos:"En cuclillas bajas con las manos en el suelo y el peso repartido.",mov:"Mantén el círculo girando al ritmo, sin apoyar rodillas ni cadera.",err:"Si apoyas la rodilla para descansar, esa vuelta no cuenta.",repFactor:.35,alt:"Mantén el círculo sin apoyar rodillas ni cadera. 1 rep = 1 vuelta."}]},pushup:{E:[{name:"Traslado de peso en cuadrupedia",pos:"Manos y rodillas en el suelo, manos bajo los hombros y rodillas bajo la cadera.",mov:"Lleva el peso adelante hasta que los hombros pasen las muñecas, y vuelve.",err:"Si la muñeca molesta, reparte el peso en toda la palma y no solo en el talón de la mano.",repFactor:1,alt:"Manos y rodillas en el suelo, lleva el peso adelante sobre las manos y vuelve. 1 rep = 1 ciclo."},{name:"Movilidad de muñecas apoyado",pos:"De rodillas con las palmas en el suelo y los dedos apuntando hacia las rodillas.",mov:"Haz círculos y traslados de peso sobre las palmas, y después sobre el dorso de las manos.",err:"Si duele, saca peso: esto prepara todo lo que viene y no se fuerza.",repFactor:1.1,alt:"Círculos y traslados sobre las palmas, también sobre el dorso. Es la preparación de todo lo que viene después."},{name:"Queda de rins asistida",pos:"De costado, una mano en el suelo y el codo de ese brazo clavado en el hueso de la cadera.",mov:"Reparte el peso entre esa mano y ese codo y aguanta, con los pies todavía ayudando.",err:"Si el codo resbala, búscalo más arriba: tiene que quedar trabado en la cresta de la cadera.",repFactor:.9,alt:"De costado, el codo clavado en la cadera y el peso repartido entre mano y codo. 1 rep = 3 segundos por lado."}],D:[{name:"Flexión de oso",pos:"En posición de bestia: cuadrupedia con las rodillas a un palmo del suelo.",mov:"Baja el pecho doblando los codos y empuja hasta estirar, sin apoyar las rodillas.",err:"Si las rodillas tocan el suelo, súbelas antes de bajar el pecho.",repFactor:1,alt:"En posición de bestia, con las rodillas a un palmo del suelo, baja el pecho y sube."},{name:"Fondo de cangrejo",pos:"Sentado con las manos detrás, dedos hacia los pies, cadera despegada del suelo.",mov:"Dobla los codos bajando la cadera casi hasta el suelo y empuja hasta estirar.",err:"Si el hombro molesta, gira las manos un poco hacia afuera.",repFactor:1,alt:"Sentado, manos detrás y cadera despegada, dobla los codos y sube."},{name:"Perro boca abajo a plancha",pos:"Manos y pies en el suelo con la cadera bien alta, cuerpo en forma de V invertida.",mov:"Pasa el peso adelante hasta quedar en plancha alta y vuelve a subir la cadera.",err:"Si la lumbar se hunde en la plancha, aprieta glúteos antes de pasar adelante.",repFactor:1,alt:"Cadera alta y luego cuerpo recto, pasando el peso a las manos. 1 rep = 1 ciclo."}],C:[{name:"Aú asistido (rueda con apoyo)",pos:"De pie de costado con las piernas separadas y una mano ya apuntando al suelo.",mov:"Apoya una mano y después la otra pasando las piernas dobladas por arriba, y cae del otro lado.",err:"Si te caes hacia adelante, mira las manos al pasar y no al frente.",repFactor:.8,alt:"La rueda lateral de capoeira, pasando por la pared o con las piernas dobladas. Cuenta las reps por lado."},{name:"Baby freeze asistido",pos:"En cuclillas con una mano en el suelo y el codo de esa mano clavado en el costado del abdomen.",mov:"Carga el peso sobre ese codo y la cabeza, con un pie todavía apoyado, y aguanta.",err:"Si te vas hacia adelante, baja más la cadera y acerca la cabeza a las manos.",repFactor:0.46,alt:"Codo clavado en el costado y la cabeza como tercer apoyo, con un pie en el suelo. 1 rep = 3 segundos."},{name:"Pino contra la pared (bananeira)",pos:"De espaldas a la pared, en plancha alta con los pies apoyados en el rodapié.",mov:"Camina los pies por la pared y las manos hacia ella hasta quedar casi vertical, y aguanta.",err:"Si la lumbar se arquea, aprieta glúteos y abdomen: el cuerpo va en una línea.",repFactor:0.46,alt:"De espaldas a la pared, sube caminando los pies. 1 rep = 3 segundos."}],B:[{name:"Aú (rueda lateral completa)",pos:"De pie de costado con las piernas bien separadas y los brazos arriba.",mov:"Apoya una mano y después la otra pasando por la vertical con las piernas estiradas, y cae de pie.",err:"Si las piernas se doblan estás pasando bajo: apunta a que pasen por encima de la cabeza.",repFactor:.7,alt:"Piernas estiradas y paso limpio por la vertical. Cuenta las reps por lado."},{name:"Baby freeze",pos:"Una mano en el suelo con el codo clavado en el costado del abdomen, la otra mano apoyada y la cabeza como tercer punto.",mov:"Despega los dos pies y aguanta el equilibrio sobre codo, mano y cabeza.",err:"Si te caes hacia adelante baja más la cadera; si te caes hacia atrás, súbela.",repFactor:0.33,alt:"Sin apoyo de pies, solo codo, mano y cabeza. 1 rep = 3 segundos."},{name:"Wall walk hacia el pino",pos:"En plancha alta de espaldas a la pared, con los pies apoyados en el rodapié.",mov:"Camina los pies por la pared hacia arriba y las manos hacia la pared, hasta quedar con el pecho cerca.",err:"Si la lumbar se arquea al subir, para ahí y baja: no sigas caminando las manos.",repFactor:.7,alt:"De frente a la pared, camina los pies hacia arriba y las manos hacia la pared."}],A:[{name:"Queda de rins",pos:"De costado, una mano en el suelo y el codo de ese brazo clavado en la cresta de la cadera.",mov:"Pasa todo el peso a esa mano y ese codo, despega los pies y aguanta.",err:"Si apoyas la cabeza todavía no es queda de rins: baja el tiempo antes que la calidad.",repFactor:0.25,alt:"Todo el peso en la mano y el codo, sin apoyar la cabeza. 1 rep = 3 segundos por lado."},{name:"Pino de cara a la pared",pos:"De espaldas a la pared, en plancha, caminando hasta quedar vertical con el pecho hacia la pared.",mov:"Deja las manos a un palmo del rodapié, estira las puntas al techo y aguanta.",err:"Si la lumbar se arquea, aprieta glúteos y mete las costillas hacia dentro.",repFactor:0.25,alt:"Pecho hacia la pared y manos a un palmo del rodapié. 1 rep = 3 segundos."},{name:"Elbow freeze",pos:"En cuclillas con las dos manos en el suelo y los dos codos clavados en el abdomen.",mov:"Pasa el peso adelante hasta despegar los pies y aguanta el cuerpo horizontal.",err:"Si los codos resbalan, búscalos más adentro, contra el hueso de la cadera.",repFactor:0.25,alt:"Los dos codos clavados en el abdomen, cuerpo horizontal. 1 rep = 3 segundos."}],S:[{name:"Pino libre (bananeira)",pos:"De pie con una pierna adelantada y los brazos arriba junto a las orejas, lejos de la pared.",mov:"Apoya las manos y patea con la pierna de atrás hasta la vertical, y aguanta.",err:"Si te pasas, sal girando hacia un costado: nunca aguantes una caída de espaldas.",repFactor:0.16,alt:"Entrada con patada controlada lejos de la pared. 1 rep = 3 segundos."},{name:"Flexión en pino contra la pared",pos:"En pino contra la pared, manos a un palmo del rodapié y el cuerpo estirado.",mov:"Baja hasta rozar el suelo con la cabeza y empuja hasta estirar los brazos.",err:"Si no llegas a subir, haz solo la bajada lenta: la fuerza viene de ahí.",repFactor:.4,alt:"Baja hasta rozar la cabeza y sube. Si no llegas, haz solo la bajada."},{name:"Aú batido",pos:"De pie de costado con las piernas separadas y los brazos arriba.",mov:"Haz la rueda con las piernas juntas y frena un instante en la vertical antes de caer.",err:"Si no puedes frenar arriba, todavía te falta pino: practica el sostén contra la pared.",repFactor:.4,alt:"Rueda con las piernas juntas y pausa arriba. Cuenta las reps por lado."}],Z:[{name:"Pino libre con caminata",pos:"En pino libre, cuerpo en una sola línea y la mirada entre las manos.",mov:"Da pasos cortos con las manos sin perder la línea del cuerpo.",err:"Si la cadera se va hacia un lado, para y recupera la vertical antes de seguir.",repFactor:.35,alt:"Camina sobre las manos sin perder la línea. 1 rep = 1 paso."},{name:"Flexión en pino libre",pos:"En pino libre lejos de la pared, cuerpo estirado y hombros abiertos.",mov:"Baja con control hasta rozar el suelo con la cabeza y empuja hasta estirar.",err:"Si pierdes el equilibrio hacia adelante, corrige con los dedos, nunca con la espalda.",repFactor:.3,alt:"Sin pared. Control total en la bajada."},{name:"Molino (windmill): progresión",pos:"Sentado en el suelo apoyado en un hombro, piernas abiertas en V y manos listas para apoyar.",mov:"Gira las piernas abiertas pasando el peso de un hombro a la espalda y al otro hombro.",err:"Si la cabeza golpea el suelo, mete la barbilla y practica sobre una superficie blanda.",repFactor:.3,alt:"Desde la espalda, gira las piernas abiertas pasando por los hombros. 1 rep = 1 vuelta."}]},back:{E:[{name:"Retracción escapular colgado",pos:"Colgado de la barra con los brazos estirados y los hombros sueltos junto a las orejas.",mov:"Baja los hombros alejándolos de las orejas sin doblar los codos, y vuelve a soltarlos.",err:"Si doblas los codos ya es una dominada: el movimiento es solo de escápulas.",repFactor:1,alt:"Colgado de la barra, sube y baja los hombros sin doblar los codos. Sin barra: boca abajo en el suelo, despega el pecho juntando las escápulas."},{name:"Arrastre con trapos",pos:"Boca abajo con un trapo bajo cada mano y los brazos estirados adelante.",mov:"Tira del piso con una mano y con la otra para arrastrar el cuerpo hacia adelante.",err:"Si empujas con los pies el dorsal deja de trabajar: que las piernas vayan muertas.",repFactor:1,alt:"Boca abajo, un trapo bajo cada mano, tira del suelo para avanzar. 1 rep = 1 brazada. Sin trapos o sobre alfombra: arrastre de comando, tirando con los codos."},{name:"Colgarse pasivo",pos:"Colgado de la barra con los brazos estirados y todo el cuerpo relajado.",mov:"Deja que el peso te estire la espalda y los hombros, y aguanta.",err:"Si el agarre falla antes que la espalda, baja, sacude las manos y vuelve a colgarte.",repFactor:.8,alt:"Hombros sueltos, deja que la espalda se estire. 1 rep = 3 segundos. Sin barra: cuélgate del marco de una puerta con los pies apoyados."}],D:[{name:"Colgarse activo",pos:"Colgado de la barra con los brazos estirados y los hombros junto a las orejas.",mov:"Baja los hombros y llévalos atrás sin doblar los codos, y aguanta.",err:"Si el pecho se hunde, saca el esternón: la espalda se aprieta, no se encoge.",repFactor:.8,alt:"Hombros abajo y atrás sin doblar los codos. 1 rep = 3 segundos. Sin barra: en el marco de una puerta con los pies apoyados, deja caer el peso y baja los hombros."},{name:"Arrastre de comando",pos:"Boca abajo apoyado en los antebrazos, con las piernas estiradas y sueltas.",mov:"Avanza clavando un codo en el suelo y tirando del cuerpo, alternando brazos.",err:"Si te ayudas con las rodillas el dorsal deja de tirar: deja las piernas muertas.",repFactor:1,alt:"Boca abajo sobre los antebrazos, avanza tirando con los codos. 1 rep = 1 brazada."},{name:"Rolê con tracción de brazo",pos:"En la negativa: cuclillas con una pierna estirada al costado y una mano en el suelo.",mov:"Rueda hacia el otro lado tirando del suelo con la mano de apoyo, no empujando.",err:"Si empujas en vez de tirar, el ejercicio deja de ser de espalda.",repFactor:.9,alt:"En la rodada baja, tira del suelo con la mano de apoyo. Cuenta las reps por lado."}],C:[{name:"Macaco asistido",pos:"En cuclillas con una mano en el suelo detrás de la cadera y la otra al costado para ayudar.",mov:"Tira del suelo con la mano de atrás para pasar la cadera por encima de ese hombro.",err:"Si el hombro se va hacia adelante, acerca más la mano al cuerpo antes de tirar.",repFactor:.7,alt:"Desde cuclillas, una mano atrás; tira del suelo para pasar la cadera por encima del hombro, ayudándote con la otra mano. Cuenta las reps por lado."},{name:"Balanceo colgado",pos:"Colgado de la barra con los brazos estirados y el cuerpo quieto.",mov:"Inicia el balanceo desde la espalda, abriendo y cerrando el hombro.",err:"Si pateas con las piernas, el impulso no sale de donde tiene que salir.",repFactor:.7,alt:"El impulso sale de la espalda, no de las piernas. 1 rep = 1 balanceo completo. Sin barra: arrastre de foca, tirando fuerte con los dos brazos a la vez."},{name:"Arrastre de foca",pos:"Boca abajo con las manos en el suelo junto al pecho y las piernas estiradas y sueltas.",mov:"Tira del suelo con los dos brazos a la vez para avanzar, arrastrando las piernas.",err:"Si la cadera se levanta, bájala: tiene que ir arrastrando todo el tiempo.",repFactor:.9,alt:"Piernas muertas, avanzas solo con los brazos. 1 rep = 1 brazada."}],B:[{name:"Macaco",pos:"En cuclillas con una mano en el suelo detrás de la cadera, dedos hacia ti, la otra mano libre.",mov:"Empuja con las piernas y tira del suelo pasando la cadera por encima de ese hombro.",err:"Si necesitas la segunda mano, vuelve unas semanas al macaco asistido.",repFactor:.55,alt:"Sin ayuda de la segunda mano. Cuenta las reps por lado."},{name:"Skin the cat agrupado",pos:"Colgado de la barra con los brazos estirados y las rodillas al pecho.",mov:"Pasa las rodillas entre los brazos y sigue bajando por detrás hasta donde el hombro aguante.",err:"Si el hombro tira fuerte, para y vuelve: este es el movimiento donde más se rompe un hombro.",repFactor:.5,alt:"Colgado, pasa las rodillas entre los brazos y baja por detrás. Sin barra: rodada hacia atrás agrupada en el suelo."},{name:"Tracción a la barra desde el suelo",pos:"Boca arriba bajo una barra baja, manos en la barra y talones en el suelo.",mov:"Tira hasta que el pecho toque la barra y baja hasta estirar los brazos.",err:"Si la cadera se cae, aprieta glúteos: el cuerpo va en una sola línea.",repFactor:.5,alt:"Barra baja, pies apoyados, tira hasta el pecho. Sin barra: arrastre con trapos tirando fuerte. Sobre alfombra, donde los trapos no deslizan: arrastre de comando cuesta arriba."}],A:[{name:"Skin the cat completo",pos:"Colgado de la barra con los brazos estirados y las piernas juntas y rectas.",mov:"Pasa las piernas estiradas entre los brazos y baja por detrás hasta donde el hombro aguante.",err:"Baja solo hasta donde controles la vuelta: si no puedes volver, bajaste de más.",repFactor:.4,alt:"Piernas estiradas al pasar. Baja solo hasta donde el hombro aguante. Sin barra: rodada hacia atrás con las piernas estiradas, frenando con los brazos."},{name:"Macaco alto",pos:"En cuclillas con una mano en el suelo detrás de la cadera, dedos hacia ti.",mov:"Pasa la cadera por encima de la línea del hombro, más alto que en el macaco normal.",err:"Si la cadera no sube, empuja más fuerte con las piernas al arrancar.",repFactor:.4,alt:"Cadera por encima de la línea del hombro. Cuenta las reps por lado."},{name:"Escalada en la barra",pos:"Colgado de una barra larga con los brazos estirados y el cuerpo quieto.",mov:"Avanza soltando una mano por vez y trasladándola al costado.",err:"Si te balanceas al soltar, aprieta el abdomen y avanza más corto.",repFactor:.4,alt:"Colgado, avanza de mano en mano. 1 rep = 1 traslado. Sin barra: arrastre de comando cuesta arriba."}],S:[{name:"Front lever agrupado",pos:"Colgado de la barra con las rodillas al pecho y los brazos estirados.",mov:"Lleva el torso a la horizontal mirando al techo y aguanta.",err:"Si la cadera se cae, agrúpate más: primero la posición y después el tiempo.",repFactor:.3,alt:"Rodillas al pecho y torso horizontal. 1 rep = 3 segundos. Sin barra: boca abajo, despega pecho y piernas y lleva los brazos atrás como si remaras. 1 rep = 3 segundos."},{name:"Macaco a una mano asistido",pos:"En cuclillas con una mano en el suelo detrás de la cadera y la otra apenas rozando el piso.",mov:"Pasa la cadera por encima del hombro cargando casi todo el peso en la mano de atrás.",err:"Si la segunda mano empuja, quítale peso hasta que solo roce.",repFactor:.3,alt:"La segunda mano apenas roza el suelo. Cuenta las reps por lado."},{name:"Colgarse a una mano",pos:"Colgado de la barra con una mano, la otra tomando esa muñeca.",mov:"Deja el peso en el brazo principal y aguanta.",err:"Si el hombro se va hacia arriba, bájalo: colgarse muerto de un brazo lesiona.",repFactor:.3,alt:"La otra mano en la muñeca. 1 rep = 3 segundos por lado. Sin barra: del marco de una puerta a una mano, con los pies apoya
