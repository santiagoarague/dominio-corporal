<head>
<meta charset="utf-8">

<style>
@font-face{font-family:'Chakra Petch';font-style:normal;font-weight:400;font-display:swap;src:url('./fuentes/chakra-400.woff2') format('woff2');}
@font-face{font-family:'Chakra Petch';font-style:normal;font-weight:500;font-display:swap;src:url('./fuentes/chakra-500.woff2') format('woff2');}
@font-face{font-family:'Chakra Petch';font-style:normal;font-weight:600;font-display:swap;src:url('./fuentes/chakra-600.woff2') format('woff2');}
@font-face{font-family:'Chakra Petch';font-style:normal;font-weight:700;font-display:swap;src:url('./fuentes/chakra-700.woff2') format('woff2');}
@font-face{font-family:'Inter';font-style:normal;font-weight:100 900;font-display:swap;src:url('./fuentes/inter-var.woff2') format('woff2');}
:root{color-scheme:dark;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:#0a0e1a;overflow-x:hidden;}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}
@supports(-webkit-touch-callout:none){input,textarea,select{font-size:16px;}}

input,button,textarea{font:inherit;}
button{cursor:pointer;touch-action:manipulation;background:transparent;border:none;color:inherit;min-height:44px;min-width:44px;}
input,select,textarea{min-height:44px;}
input:focus,button:focus,textarea:focus{outline:2px solid #4f9dff;outline-offset:1px;}
.absolute{position:absolute;}
.relative{position:relative;}
.block{display:block;}
.flex{display:flex;}
.grid{display:grid;}
.grid-cols-2{grid-template-columns:repeat(2,minmax(0,1fr));}
.grid-cols-3{grid-template-columns:repeat(3,minmax(0,1fr));}
.grid-cols-4{grid-template-columns:repeat(4,minmax(0,1fr));}
.grid-cols-5{grid-template-columns:repeat(5,minmax(0,1fr));}
.grid-cols-6{grid-template-columns:repeat(6,minmax(0,1fr));}
.grid-cols-7{grid-template-columns:repeat(7,minmax(0,1fr));}
.flex-1{flex:1 1 0%;}
.flex-col{flex-direction:column;}
.items-center{align-items:center;}
.items-start{align-items:flex-start;}
.justify-between{justify-content:space-between;}
.justify-center{justify-content:center;}
.gap-1{gap:.25rem;}
.gap-2{gap:.5rem;}
.gap-3{gap:.75rem;}
.gap-x-3{column-gap:.75rem;}
.gap-y-1{row-gap:.25rem;}
.space-y-1>*+*{margin-top:.25rem;}
.space-y-2>*+*{margin-top:.5rem;}
.border{border-width:1px;border-style:solid;}
.border-t-2{border-top-width:2px;border-top-style:solid;}
.border-b-2{border-bottom-width:2px;border-bottom-style:solid;}
.border-l-2{border-left-width:2px;border-left-style:solid;}
.border-r-2{border-right-width:2px;border-right-style:solid;}
.w-3{width:.75rem;}
.w-full{width:100%;}
.h-2{height:.5rem;}
.h-3{height:.75rem;}
.h-full{height:100%;}
.min-h-screen{min-height:100vh;min-height:100dvh;}
.mx-auto{margin-left:auto;margin-right:auto;}
.ml-1{margin-left:.25rem;}
.ml-auto{margin-left:auto;}
.mb-1{margin-bottom:.25rem;}
.mb-2{margin-bottom:.5rem;}
.mb-3{margin-bottom:.75rem;}
.mb-4{margin-bottom:1rem;}
.mb-6{margin-bottom:1.5rem;}
.mt-1{margin-top:.25rem;}
.mt-2{margin-top:.5rem;}
.mt-3{margin-top:.75rem;}
.mt-4{margin-top:1rem;}
.mt-8{margin-top:2rem;}
.my-2{margin-top:.5rem;margin-bottom:.5rem;}
.p-2{padding:.5rem;}
.p-3{padding:.75rem;}
.p-4{padding:1rem;}
.px-2{padding-left:.5rem;padding-right:.5rem;}
.px-3{padding-left:.75rem;padding-right:.75rem;}
.px-4{padding-left:1rem;padding-right:1rem;}
.py-1{padding-top:.25rem;padding-bottom:.25rem;}
.py-2{padding-top:.5rem;padding-bottom:.5rem;}
.py-3{padding-top:.75rem;padding-bottom:.75rem;}
.py-6{padding-top:1.5rem;padding-bottom:1.5rem;}

.text-left{text-align:left;}
.text-sm{font-size:1rem;line-height:1.375rem;}
.text-xs{font-size:.875rem;line-height:1.25rem;}
.uppercase{text-transform:uppercase;}
.underline{text-decoration:underline;}
.overflow-hidden{overflow:hidden;}
.opacity-60{opacity:.6;}
.transition-all{transition-property:all;}
.duration-500{transition-duration:500ms;}
button:disabled.disabled\:opacity-30{opacity:.6;}
button:disabled.disabled\:opacity-40{opacity:.6;}
@media (prefers-reduced-motion: reduce){*{transition:none !important;}}

@keyframes sdcPop{0%{opacity:0;transform:translateY(6px) scale(.85);}18%{opacity:1;transform:translateY(0) scale(1.15);}100%{opacity:0;transform:translateY(-24px) scale(1);}}
@keyframes sdcRise{0%{opacity:0;transform:translateY(8px);}100%{opacity:1;transform:translateY(0);}}
.sdc-pop{animation:sdcPop 1.1s ease-out forwards;}
.sdc-rise{animation:sdcRise .28s ease-out;}
.sdc-chip{transition:background .12s,border-color .12s,transform .1s;}
.sdc-chip:active{transform:scale(.92);}
/* El compañero: entra desde el costado, cada tanto mueve la cabeza, y "Mostrame" ilumina el botón. */
@keyframes sdcAsoma{0%{transform:translateX(-130%);}100%{transform:translateX(0);}}
@keyframes sdcMenea{0%,80%,100%{transform:rotate(0);}85%{transform:rotate(-9deg);}90%{transform:rotate(9deg);}95%{transform:rotate(-4deg);}}
@keyframes sdcLuz{0%,100%{box-shadow:0 0 0 3px #ffb84f;}50%{box-shadow:0 0 0 8px rgba(255,184,79,.3);}}
.sdc-asoma{animation:sdcAsoma .45s ease-out both;}
.sdc-menea{animation:sdcMenea 2.6s ease-in-out .5s infinite;}
.sdc-luz{outline:3px solid #ffb84f;outline-offset:2px;animation:sdcLuz 1.1s ease-in-out 4;}
@media (prefers-reduced-motion: reduce){.sdc-pop{animation:none !important;opacity:1;}.sdc-rise,.sdc-asoma,.sdc-menea,.sdc-luz{animation:none !important;}}

<meta name="theme-color" content="#0a0e1a">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="preload" href="./fuentes/inter-var.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body>
<div id="sdcSplash" aria-hidden="true"><div class="sdcSplashIn"><div class="sdcSplashT">DOMINIO CORPORAL</div><div class="sdcSplashN" id="sdcSplashN">Abriendo&#8230;</div><div class="sdcSplashL" id="sdcSplashL"></div><div class="sdcSplashBar"><span></span></div></div></div>
<style>
#sdcSplash{position:fixed;inset:0;z-index:9999;background:#0a0e1a;display:flex;align-items:center;justify-content:center;transition:opacity .25s ease}
#sdcSplash .sdcSplashIn{width:100%;max-width:340px;padding:0 16px;text-align:center}
#sdcSplash .sdcSplashT{font-family:'Chakra Petch',system-ui,sans-serif;font-size:18px;font-weight:700;letter-spacing:3px;color:#4f9dff}
#sdcSplash .sdcSplashN{font-family:'Inter',system-ui,sans-serif;font-size:22px;line-height:1.35;font-weight:600;color:#e8ecf7;margin-top:16px;min-height:30px}
#sdcSplash .sdcSplashL{font-family:'Inter',system-ui,sans-serif;font-size:17px;color:#9aa4bd;margin-top:6px;min-height:24px}
#sdcSplash .sdcSplashBar{margin-top:22px;height:2px;background:rgba(255,255,255,0.08);overflow:hidden}
#sdcSplash .sdcSplashBar span{display:block;height:2px;width:40%;background:#4f9dff;animation:sdcSplashSlide 1.1s ease-in-out infinite}
@keyframes sdcSplashSlide{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
@media (prefers-reduced-motion:reduce){#sdcSplash .sdcSplashBar span{animation:none;width:100%;opacity:.5}}
</style>
<div id="root"></div>
<script>
(function(){
  // A quien vuelve, el saludo se le deja al menos 2,5 s desde que abre: con el
  // teléfono ya cacheado la app arranca en menos de un segundo y no se llegaba a leer.
  // Tocar la pantalla lo saca antes.
  var inicio=Date.now(),vuelve=false,MINIMO=2500;
  try{
    var raw=localStorage.getItem('dominio-corporal:player/state');
    if(raw){
      var s=JSON.parse(raw),n=s&&s.profile&&s.profile.name,lv=s&&s.progress&&s.progress.level;
      if(n){
        document.getElementById('sdcSplashN').textContent='Hola de nuevo, '+n;
        if(lv)document.getElementById('sdcSplashL').textContent='Nivel '+lv;
        vuelve=true;
      }
    }
  }catch(e){}
  var root=document.getElementById('root');
  if(!root)return;
  var fuera=function(){
    var sp=document.getElementById('sdcSplash');
    if(!sp)return;
    sp.style.opacity='0';
    setTimeout(function(){if(sp.parentNode)sp.parentNode.removeChild(sp)},260);
  };
  var quitar=function(){
    var falta=vuelve?MINIMO-(Date.now()-inicio):0;
    falta>0?setTimeout(fuera,falta):fuera();
  };
  var sp0=document.getElementById('sdcSplash');
  sp0&&sp0.addEventListener('click',function(){if(root.childNodes.length)fuera()});
  if(root.childNodes.length){quitar();return}
  var obs=new MutationObserver(function(){if(root.childNodes.length){obs.disconnect();quitar()}});
  obs.observe(root,{childList:true});
  setTimeout(function(){try{obs.disconnect()}catch(e){}quitar()},25000);
})();
</script>
<script src="./storage.js"></script>
<script>
// El service worker se registra en src/main.js, solo en la version compilada.
// Sin esto el navegador puede borrar localStorage cuando le falta espacio,
// y con el se va todo el progreso: no hay servidor ni cuenta.
if (navigator.storage && navigator.storage.persist) {
  navigator.storage.persisted()
    .then((ya) => { if (!ya) return navigator.storage.persist(); })
    .catch(() => {});
}
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
